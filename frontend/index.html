<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StockIntel AI — Grocery Inventory Intelligence</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="bg-effects">
    <canvas id="particle-canvas"></canvas>
    <div class="mouse-glow" id="mouse-glow"></div>
    <div class="scan-lines"></div>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
    <div class="grid-pattern"></div>
  </div>
  <div id="app">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-bg"></div>
      <div class="sidebar-header">
        <div class="logo">
          <div class="logo-icon">
            <i class="fas fa-robot"></i>
          </div>
          <div class="logo-text-wrap">
            <span class="logo-text">StockIntel</span>
            <span class="logo-badge">AI</span>
          </div>
        </div>
      </div>
      <nav class="nav" id="nav">
        <a href="#dashboard" class="nav-item active" data-page="dashboard">
          <div class="nav-icon"><i class="fas fa-th-large"></i></div>
          <span>Dashboard</span>
          <div class="nav-indicator"></div>
        </a>
        <a href="#inventory" class="nav-item" data-page="inventory">
          <div class="nav-icon"><i class="fas fa-boxes"></i></div>
          <span>Inventory</span>
          <div class="nav-indicator"></div>
        </a>
        <a href="#prediction" class="nav-item" data-page="prediction">
          <div class="nav-icon"><i class="fas fa-brain"></i></div>
          <span>AI Prediction</span>
          <div class="nav-indicator"></div>
        </a>
        <a href="#analytics" class="nav-item" data-page="analytics">
          <div class="nav-icon"><i class="fas fa-chart-line"></i></div>
          <span>Analytics</span>
          <div class="nav-indicator"></div>
        </a>
        <a href="#ml-insights" class="nav-item" data-page="ml-insights">
          <div class="nav-icon"><i class="fas fa-flask"></i></div>
          <span>ML Insights</span>
          <div class="nav-indicator"></div>
        </a>
      </nav>
      <div class="sidebar-footer">
        <div class="footer-status">
          <div class="status-dot active"></div>
          <span>All Systems Online</span>
        </div>
        <span class="version">v1.0.0</span>
      </div>
    </aside>

    <main class="main-content" id="main-content">
      <header class="top-header">
        <div class="header-left">
          <button class="mobile-menu-btn" id="mobile-menu-btn">
            <i class="fas fa-bars"></i>
          </button>
          <div class="page-title-wrap">
            <h1 class="page-title" id="page-title">Dashboard</h1>
            <span class="page-subtitle" id="page-subtitle">AI-Powered Inventory Overview</span>
          </div>
        </div>
        <div class="header-right">
          <div class="header-status">
            <div class="status-indicator" id="ml-status">
              <div class="status-dot offline"></div>
              <span>ML Model: Loading...</span>
            </div>
          </div>
          <div class="header-time" id="header-time"></div>
        </div>
      </header>

      <div class="page-content" id="page-content">
        <div class="loading-screen">
          <div class="loader-ring">
            <div class="loader-ring-inner"></div>
          </div>
          <p class="loader-text">Loading intelligence...</p>
        </div>
      </div>
    </main>
  </div>

  <div class="toast-container" id="toast-container"></div>

  <script src="js/utils.js"></script>
  <script src="js/particles.js"></script>
  <script src="js/api.js"></script>
  <script src="js/pages/dashboard.js"></script>
  <script src="js/pages/inventory.js"></script>
  <script src="js/pages/prediction.js"></script>
  <script src="js/pages/analytics.js"></script>
  <script src="js/pages/ml-insights.js"></script>
  <script src="js/router.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
